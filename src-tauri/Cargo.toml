[package]
name = "mido"
version = "0.3.0"
description = "Mido — Markdown viewer & editor"
license-file = "../LICENSE"
publish = false
edition = "2021"

[lib]
name = "mido_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify-debouncer-mini = "0.6"
trash = "5"
tempfile = "3"
regex = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
