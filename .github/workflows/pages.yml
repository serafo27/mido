name: Website

on:
  push:
    branches: [main]
    # The site, and the app it publishes at /app/ (the read-only web version).
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
      - "src/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "vite.web.config.ts"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The read-only web version of the app, published at /app/.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Build the web version
        env:
          # Anonymous usage statistics (src/lib/analytics.ts): the key lives only in the secret.
          VITE_POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build:web
          cp -R dist-web site/app

      # Bake the published releases into the site: download links and the
      # changelog then work without visitors calling the rate-limited GitHub API.
      - name: Release data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -H "Accept: application/vnd.github.html+json" \
            "repos/$GITHUB_REPOSITORY/releases?per_page=50" \
            --jq '[.[] | select(.draft | not) | {tag_name, published_at, html_url, body_html,
                   assets: [.assets[] | {name, size, browser_download_url}]}]' > site/releases.json
          jq -r '.[] | "\(.tag_name): \([.assets[].name] | join(", "))"' site/releases.json
      # The site's own statistics (site/analytics.js) get the same key.
      - name: Statistics key
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
        run: sed -i "s/__POSTHOG_KEY__/${POSTHOG_KEY}/" site/analytics.js

      # Pages caches files for 10 minutes: versioned URLs make every deploy
      # load its own CSS and JS instead of a stale copy.
      - name: Version asset URLs
        run: |
          version="${GITHUB_SHA::7}"
          sed -i -E "s/(href|src)=\"([a-z-]+\.(css|js))\"/\1=\"\2?v=${version}\"/g" site/*.html
          grep -ho '[a-z-]*\.\(css\|js\)?v=[0-9a-f]*' site/*.html | sort -u
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
