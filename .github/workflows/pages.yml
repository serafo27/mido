name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # Pages caches files for 10 minutes: versioned URLs make every deploy
      # load its own CSS and JS instead of a stale copy.
      - name: Version asset URLs
        run: |
          version="${GITHUB_SHA::7}"
          sed -i -E "s/(href|src)=\"([a-z-]+\.(css|js))\"/\1=\"\2?v=${version}\"/g" site/*.html
          grep -ho '[a-z-]*\.\(css\|js\)?v=[0-9a-f]*' site/*.html | sort -u
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
