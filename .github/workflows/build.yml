name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Website and docs changes don't need new installers (tags always build).
    paths-ignore: ["site/**", "**.md", ".github/workflows/pages.yml"]
  pull_request:
    paths-ignore: ["site/**", "**.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

# A newer push to the same branch or PR supersedes the running build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      # Needed only to upload installers to the release on version tags.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          # Windows and Linux builds are disabled until they have been tested:
          # add them back as { os: windows-latest, target: x86_64-pc-windows-msvc }
          # and { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu } (Linux also
          # needs libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf).

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Once per workflow is enough: the tests don't depend on the target. The
      # frontend is built before the Rust tests because compiling the app needs ../dist.
      - name: Tests
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          pnpm test
          pnpm build
          cargo test --manifest-path src-tauri/Cargo.toml

      # On a version tag, the tag must match the app version and CHANGELOG.md
      # must have a section for it: that section becomes the release notes.
      - name: Release notes from CHANGELOG.md
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          app_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$version" != "$app_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the app version $app_version in tauri.conf.json"
            exit 1
          fi
          notes=$(awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## / { exit }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d')
          if [ -z "$notes" ]; then
            echo "::error::CHANGELOG.md has no section for version $version"
            exit 1
          fi
          {
            echo "body<<__MIDO_NOTES__"
            echo "$notes"
            echo "__MIDO_NOTES__"
          } >> "$GITHUB_OUTPUT"

      # Runs `pnpm build` (type-check + Vite) and bundles the app. On a `v*` tag
      # it also uploads the installers to a draft release, which the `publish`
      # job makes public once every build has succeeded, along with the app
      # zipped and signed with the updater key, which the in-app updater
      # installs (see `latest.json` below). Other builds skip the updater files,
      # so they don't need the key.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: >-
            --target ${{ matrix.target }}
            ${{ startsWith(github.ref, 'refs/tags/v') && '--config src-tauri/tauri.release.conf.json' || '' }}
          # Written once by the `publish` job: the two builds would race to update it.
          includeUpdaterJson: false
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Mido ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false

      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mido-${{ matrix.target }}
          if-no-files-found: error
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  # Publishes the draft release only after all platform builds have uploaded
  # their installers, so a release never goes out half-built.
  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # To start the website deploy below.
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # What the in-app updater reads (from the latest release) to find the
      # update for each Mac and check its signature.
      - name: Publish latest.json for the updater
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          dir=$(mktemp -d)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.app.tar.gz.sig' --dir "$dir"
          platforms='{}'
          for sig in "$dir"/*.sig; do
            name=$(basename "$sig" .sig)
            case "$name" in
              *aarch64*|*arm64*) platform=darwin-aarch64 ;;
              *x64*|*x86_64*) platform=darwin-x86_64 ;;
              *) echo "::error::Can't tell the architecture of $name"; exit 1 ;;
            esac
            platforms=$(jq --arg p "$platform" --arg s "$(cat "$sig")" \
              --arg u "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$name" \
              '. + {($p): {signature: $s, url: $u}}' <<< "$platforms")
          done
          for platform in darwin-aarch64 darwin-x86_64; do
            if [ "$(jq --arg p "$platform" 'has($p)' <<< "$platforms")" != true ]; then
              echo "::error::No signed update for $platform"
              exit 1
            fi
          done
          jq -n --arg v "${tag#v}" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson p "$platforms" \
            '{version: $v, pub_date: $d, notes: "", platforms: $p}' > "$dir/latest.json"
          cat "$dir/latest.json"
          gh release upload "$tag" "$dir/latest.json" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish the draft release
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      # Releases published with GITHUB_TOKEN don't trigger other workflows,
      # so start the website deploy explicitly to pick up the new version.
      - name: Update the website
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
